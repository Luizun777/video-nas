# Compila la app de escritorio en máquinas reales de cada sistema (así ffmpeg/ffprobe son
# los binarios correctos) y publica la release al subir un tag vX.Y.Z. Lanzado a mano
# (Actions → Run workflow) solo compila y deja los archivos como artefactos del run.
name: Release escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Release en borrador
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Crear la release (borrador hasta que compilen ambas plataformas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Video NAS $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

  build:
    name: Compilar (${{ matrix.label }})
    needs: draft
    # Al lanzarlo a mano el borrador se salta, y aun así hay que compilar.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            files: release/video-nas-*.dmg release/video-nas-*.zip
            encoder: h264_videotoolbox
          - label: Windows x64
            os: windows-latest
            files: release/video-nas-*.exe
            encoder: libx264
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - name: ffmpeg y ffprobe empaquetados arrancan
        shell: bash
        run: |
          set -eu
          unpacked="$(find release -type d -name app.asar.unpacked -print -quit)"
          ffmpeg="$(find "$unpacked" -type f \( -name ffmpeg -o -name ffmpeg.exe \) -print -quit)"
          ffprobe="$(find "$unpacked" -type f \( -name ffprobe -o -name ffprobe.exe \) -print -quit)"
          echo "ffmpeg:  $ffmpeg"
          echo "ffprobe: $ffprobe"
          "$ffmpeg" -hide_banner -version > ffmpeg-version.txt && head -n 1 ffmpeg-version.txt
          "$ffprobe" -hide_banner -version > ffprobe-version.txt && head -n 1 ffprobe-version.txt
          # El codificador que usa transcode-session.ts en esta plataforma.
          "$ffmpeg" -hide_banner -encoders | grep -w "${{ matrix.encoder }}"
          # La misma resolución que hace el main al importar ffmpeg.ts: sin el paquete de
          # la plataforma, la app ni siquiera abre.
          node -e "const p = require('path'); console.log(require(p.resolve(process.argv[1], 'node_modules/@ffprobe-installer/ffprobe')).path)" "$unpacked"

      - name: Subir a la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

      - name: Guardar como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: video-nas-${{ runner.os }}
          path: |
            release/video-nas-*.dmg
            release/video-nas-*.zip
            release/video-nas-*.exe
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Quitar el borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
