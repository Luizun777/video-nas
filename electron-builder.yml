appId: com.luizun.videonas
productName: Video NAS
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # ffmpeg/ffprobe van como node_modules reales (external en el build de main).
  - node_modules/ffmpeg-static/**/*
  - node_modules/@ffprobe-installer/**/*

# Un binario dentro del asar no puede ejecutarse; estos se quedan fuera y
# ffmpeg.ts corrige la ruta con app.asar -> app.asar.unpacked.
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/@ffprobe-installer/**"

# ffmpeg-static y @ffprobe-installer instalan SOLO el binario del sistema y la arquitectura
# donde corrió npm install: cada plataforma se empaqueta en su propia máquina (en CI,
# .github/workflows/release.yml), nunca en cruzado desde la Mac.

mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  darkModeSupport: true
  # Sin certificado de desarrollador no hay notarización, pero con la firma ad-hoc macOS
  # ofrece "Abrir igualmente" en vez de decir que la app descargada "está dañada".
  # hardenedRuntime rechazaría los frameworks de Electron (firmados por otro equipo).
  identity: "-"
  hardenedRuntime: false

win:
  target:
    - target: portable
      arch: [x64]

portable:
  # Un solo .exe que se ejecuta sin instalar (se descomprime en temp al abrirlo).
  artifactName: ${name}-${version}-windows-x64-portable.${ext}
